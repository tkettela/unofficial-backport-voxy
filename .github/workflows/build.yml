name: Check that it builds

# Only checks that the 1.20.1 Fabric version compiles. The jar is NOT uploaded anywhere:
# Voxy's license does not allow redistributing it, everyone builds their own (see README).

on:
  push:
    branches: [ server-lod ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build 1.20.1 Fabric
        run: chmod +x gradlew && ./gradlew -I init.gradle :1.20.1-fabric:build -x test
